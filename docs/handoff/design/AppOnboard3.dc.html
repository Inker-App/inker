<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding 3: how it works</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E6E4DE}a:hover{color:#fff}
</style>
</helmet>
<div style="width: 560px; height: 540px; box-sizing: border-box; padding: 32px 40px 28px; display: flex; flex-direction: column; gap: 20px; background: #0D0F10; color: #E6E4DE; font-family: 'Archivo', sans-serif; font-size: 13px; line-height: 1.45; border: 1px solid rgba(230,228,222,0.14); border-radius: 12px">
  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 11px; font-weight: 600; font-stretch: 125%; letter-spacing: 0.2em; color: #8A8C8E">STEP 3 OF 3</div>
    <h1 style="margin: 0; font-size: 22px; font-weight: 400; font-stretch: 112%; letter-spacing: 0.01em">Drop it on the octopus, not in the chat</h1>
    <p style="margin: 0; color: #8A8C8E">Instead of dragging a file into Claude or Cursor, drag it onto Inker in your menu bar.</p>
  </div>

  <canvas data-ink="ob3" role="img" aria-label="Three looping panels: a file dissolving into a handle, the handle being copied, and an eye squinting at an inked-out line" style="display: block; width: 480px; height: 150px"></canvas>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 4px"><div style="font-size: 11px; font-weight: 600; font-stretch: 125%; letter-spacing: 0.2em">1  DROP</div><div style="font-size: 12px; color: #8A8C8E">It moves into ~/Private and gets inked.</div></div>
    <div style="display: flex; flex-direction: column; gap: 4px"><div style="font-size: 11px; font-weight: 600; font-stretch: 125%; letter-spacing: 0.2em">2  COPY</div><div style="font-size: 12px; color: #8A8C8E">A <span style="font-family: 'JetBrains Mono', monospace; color: #E6E4DE">🐙/</span> handle lands on your clipboard.</div></div>
    <div style="display: flex; flex-direction: column; gap: 4px"><div style="font-size: 11px; font-weight: 600; font-stretch: 125%; letter-spacing: 0.2em">3  PASTE</div><div style="font-size: 12px; color: #8A8C8E">Your agent reads it. The eyes only see ink.</div></div>
  </div>

  <div style="margin-top: auto; display: flex; justify-content: space-between">
    <a href="AppOnboard2.dc.html" style="display: inline-flex; align-items: center; height: 36px; padding: 0 12px; color: #8A8C8E; text-decoration: none">Back</a>
    <a href="AppPopEmpty.dc.html" style="display: inline-flex; align-items: center; height: 36px; padding: 0 18px; border-radius: 6px; background: #E6E4DE; color: #0D0F10; text-decoration: none; font-weight: 600">Done</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":540}}'>
var PAPER='#E6E4DE',RED='#E0473E',MUTE='#8A8C8E',PANEL='#08090A',RIM='#3A3D40';
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function ss(a,b,x){x=(x-a)/(b-a);x=x<0?0:x>1?1:x;return x*x*(3-2*x);}
function n3(x,y,z){var l=Math.hypot(x,y,z)||1;return[x/l,y/l,z/l];}
function setup(el,W,H){var d=window.devicePixelRatio||1;el.width=Math.round(W*d);el.height=Math.round(H*d);var ctx=el.getContext('2d');ctx.setTransform(d,0,0,d,0,0);return ctx;}
function loop(fn){var last=performance.now(),id,on=true;function f(t){if(!on)return;var dt=Math.min(0.033,Math.max(0,(t-last)/1000));last=t;fn(dt,t/1000);id=requestAnimationFrame(f);}id=requestAnimationFrame(f);return function(){on=false;cancelAnimationFrame(id);};}
function find(sel,cb){var tries=0;(function look(){var el=document.querySelector(sel);if(el)cb(el);else if(tries++<240)requestAnimationFrame(look);})();}
function put(p,x,y,b,C){if(b<0.015)return;var r=C/2*Math.min(1.05,Math.sqrt(b));p.moveTo(x+r,y);p.arc(x,y,r,0,6.2832);}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
/* ink grid */
function ones(w,h){return{w:w,h:h,a:new Float32Array(w*h).fill(1)};}
function field(b,cell,o){o=o||{};var n=b.w*b.h;return{w:b.w,h:b.h,base:b.a,v:new Float32Array(b.a),jr:new Uint8Array(n).fill(1),jd:new Uint8Array(n).fill(1),cell:cell,gap:cell*0.1,ox:o.ox||0,oy:o.oy||0,dx:new Float32Array(n),dy:new Float32Array(n)};}
function poly(ctx,p){var s=0,i,n=p.length;for(i=0;i<n;i++){var q=p[(i+1)%n];s+=p[i][0]*q[1]-q[0]*p[i][1];}if(s<0)p.reverse();ctx.moveTo(p[0][0],p[0][1]);for(i=1;i<n;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();}
function ctr(F,i){var c=F.cell;return[F.ox+(i%F.w)*c+c/2+F.dx[i],F.oy+((i/F.w)|0)*c+c/2+F.dy[i]];}
function bridge(ctx,F,i,j,R){var rb=R*ss(0.55,0.9,Math.min(F.v[i],F.v[j]));if(rb<=0)return;var a=ctr(F,i),b=ctr(F,j),ex=b[0]-a[0],ey=b[1]-a[1],L=Math.hypot(ex,ey);if(L<0.001||L>F.cell*1.6)return;var nx=-ey/L*rb,ny=ex/L*rb;poly(ctx,[[a[0]+nx,a[1]+ny],[b[0]+nx,b[1]+ny],[b[0]-nx,b[1]-ny],[a[0]-nx,a[1]-ny]]);}
function drawInk(ctx,F,col){var w=F.w,h=F.h,R=F.cell/2-F.gap/2,x,y,i;ctx.beginPath();for(y=0;y<h;y++)for(x=0;x<w;x++){i=y*w+x;var v=F.v[i];if(v<0.02)continue;var c=ctr(F,i),r=R*Math.min(1,v);ctx.moveTo(c[0]+r,c[1]);ctx.arc(c[0],c[1],r,0,6.2832);var jr=x<w-1&&F.v[i+1]>0.02,jd=y<h-1&&F.v[i+w]>0.02;if(jr)bridge(ctx,F,i,i+1,R);if(jd)bridge(ctx,F,i,i+w,R);if(jr&&jd&&Math.min(v,F.v[i+1],F.v[i+w],F.v[i+w+1])>0.88)poly(ctx,[ctr(F,i),ctr(F,i+1),ctr(F,i+w+1),ctr(F,i+w)]);}ctx.fillStyle=col;ctx.fill();}
/* eyes */
var LGT=n3(-0.45,-0.55,0.7),HV=n3(LGT[0],LGT[1],LGT[2]+1);
function eyeDraw(main,acc,cx,cy,R,gx,gy,gz,lid,spin,C,W,H){var i0=Math.max(0,Math.floor((cx-R)/C)),i1=Math.min(Math.floor(W/C)-1,Math.ceil((cx+R)/C)),j0=Math.max(0,Math.floor((cy-R)/C)),j1=Math.min(Math.floor(H/C)-1,Math.ceil((cy+R)/C));
  for(var j=j0;j<=j1;j++)for(var i=i0;i<=i1;i++){var px=(i+0.5)*C,py=(j+0.5)*C,dx=(px-cx)/R,dy=(py-cy)/R,d2=dx*dx+dy*dy;if(d2>1)continue;var z=Math.sqrt(1-d2),lam=Math.max(0,dx*LGT[0]+dy*LGT[1]+z*LGT[2]),sp=Math.pow(Math.max(0,dx*HV[0]+dy*HV[1]+z*HV[2]),48),b,isI=false;
    if(Math.abs(dy)>1-lid)b=0.05+0.3*lam;else{var ca=dx*gx+dy*gy+z*gz;if(ca>0.955)b=sp*0.35;else if(ca>0.83){var ang=Math.atan2(dy-gy*ca,dx-gx*ca);b=(0.32+0.48*lam)*(0.72+0.28*Math.sin(ang*14+spin))*ss(0.83,0.85,ca)+sp*0.3;isI=true;}else b=(0.08+0.72*lam)*(0.55+0.45*Math.sqrt(z))+sp*0.3;}
    put(isI?acc:main,px,py,b,C);}}

function start(el,self){
  if(el.__inkStop)el.__inkStop();
  var W=480,H=150,ctx=setup(el,W,H),PW=152,X=[0,164,328];
  var src=field(ones(3,4),10,{ox:X[0]+61,oy:18}),tgt=field(ones(8,1),10,{ox:X[0]+36,oy:104});
  var hr=rng(5),sh=[];for(var q=0;q<20;q++)sh.push(hr());
  var stop=loop(function(dt,t){
    ctx.clearRect(0,0,W,H);
    for(var p=0;p<3;p++){ctx.fillStyle=PANEL;rrect(ctx,X[p],0,PW,H,8);ctx.fill();}
    var j,u=t%4.6,R=5-0.5;
    /* 1 DROP */
    if(u<1.2){for(j=0;j<12;j++)src.v[j]=ss(0,0.35,u-j*0.02)*(1-0.4*ss(0.85,1.15,u));drawInk(ctx,src,PAPER);}
    if(u>=1.15&&u<2.5){ctx.fillStyle=PAPER;ctx.beginPath();for(j=0;j<8;j++){var pr=ss(0,1,(u-1.15-j*0.04)/0.85),a=ctr(src,j),c=ctr(tgt,j),px=a[0]+(c[0]-a[0])*pr+Math.sin(Math.PI*pr)*((j%2)?10:-10),py=a[1]+(c[1]-a[1])*pr;ctx.moveTo(px+R*0.6,py);ctx.arc(px,py,R*0.6,0,6.2832);}ctx.fill();}
    if(u>=2.5){for(j=0;j<8;j++)tgt.v[j]=(0.6+0.4*ss(0,0.35,u-2.5-j*0.02))*(1-ss(4.0,4.5,u));drawInk(ctx,tgt,PAPER);
      ctx.globalAlpha=ss(2.8,3.0,u)*(1-ss(4.0,4.3,u));ctx.fillStyle=PAPER;ctx.font='600 10px "JetBrains Mono", monospace';ctx.textAlign='center';ctx.fillText('🐙/w2-acme',X[0]+76,134);ctx.textAlign='left';ctx.globalAlpha=1;}
    /* 2 COPY */
    var u2=t%3.2,cx2=X[1]+76,cy2=75;
    ctx.strokeStyle='rgba(230,228,222,0.35)';ctx.lineWidth=1;rrect(ctx,cx2-58,cy2-14,116,28,14);ctx.stroke();
    ctx.fillStyle=PAPER;ctx.font='600 11px "JetBrains Mono", monospace';ctx.textAlign='center';ctx.fillText('🐙/w2-acme-2025',cx2,cy2+4);
    ctx.globalAlpha=ss(0.4,0.55,u2)*(1-ss(1.6,1.9,u2));ctx.fillStyle=MUTE;ctx.font='500 10px Archivo, sans-serif';ctx.fillText('copied',cx2,cy2+34);ctx.globalAlpha=1;ctx.textAlign='left';
    if(u2>0.4&&u2<1.4){var e2=u2-0.4,dd=ss(0,0.8,e2)*26,br=2.2*(1-ss(0.2,1,e2));ctx.fillStyle=PAPER;ctx.beginPath();for(var k=0;k<18;k++){var an=k/18*6.2832,bx=cx2+Math.cos(an)*(58+dd),by=cy2+Math.sin(an)*(14+dd*0.5);if(br>0.2){ctx.moveTo(bx+br,by);ctx.arc(bx,by,br,0,6.2832);}}ctx.fill();}
    /* 3 PASTE: eye peers at inked line */
    var lx=X[2]+20,ly=112,sx=lx+30,sw=86;
    ctx.fillStyle=PAPER;ctx.font='500 11px "JetBrains Mono", monospace';ctx.fillText('SSN',lx,ly+4);
    ctx.fillStyle='#000';rrect(ctx,sx,ly-8,sw,16,8);ctx.fill();
    ctx.fillStyle=RIM;for(var m=0;m<20;m++){var mx=sx+4+(m%10)*(sw-8)/9,my=m<10?ly-10:ly+10;ctx.beginPath();ctx.arc(mx,my,0.8+sh[m]*1.2,0,6.2832);ctx.fill();}
    var ecx=X[2]+76+Math.sin(t*0.8)*3,ecy=48,ER=28,tx=sx+sw/2+Math.sin(t*1.7)*30,g=n3(tx-ecx,ly-ecy,70),lid=0.38+0.08*Math.sin(t*3),bl=(t%3.7);if(bl<0.2)lid=Math.max(lid,Math.sin(Math.PI*bl/0.2));
    var main=new Path2D(),acc=new Path2D();eyeDraw(main,acc,ecx,ecy,ER,g[0],g[1],g[2],lid,1.3,4,W,H);ctx.fillStyle=PAPER;ctx.fill(main);ctx.fillStyle=RED;ctx.fill(acc);
  });
  el.__inkStop=stop;return stop;
}
class Component extends DCLogic {
  componentDidMount(){var self=this;find('canvas[data-ink="ob3"]',function(el){self.stopInk=start(el,self);});}
  componentWillUnmount(){if(this.stopInk)this.stopInk();}
  renderVals(){return{};}
}
</script>
</body>
</html>
