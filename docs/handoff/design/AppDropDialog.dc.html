<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First drop: move or copy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E6E4DE}a:hover{color:#fff}
input[type=checkbox]{accent-color:#E6E4DE}
</style>
</helmet>
<div style="width: 440px; height: 280px; box-sizing: border-box; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; background: #0D0F10; color: #E6E4DE; font-family: 'Archivo', sans-serif; font-size: 13px; line-height: 1.45; border: 1px solid rgba(230,228,222,0.14); border-radius: 12px">
  <canvas data-ink="dlg" role="img" aria-label="Eyeballs peering at four files sitting in Downloads" style="display: block; width: 392px; height: 76px; background: #08090A; border-radius: 8px"></canvas>
  <div style="display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 15px; font-weight: 600; font-stretch: 112%">Move these 4 files out of ~/Downloads?</h1>
    <p style="margin: 0; color: #8A8C8E">Agents can usually read Downloads. Moving leaves nothing behind for them to look at.</p>
  </div>
  <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #C9C7C1"><input type="checkbox"> Always move, don't ask again</label>
  <div style="margin-top: auto; display: flex; justify-content: flex-end; gap: 8px">
    <button type="button" style="height: 32px; padding: 0 14px; border: 1px solid rgba(230,228,222,0.3); border-radius: 6px; background: transparent; font: inherit; color: #E6E4DE">Copy instead</button>
    <button type="button" style="height: 32px; padding: 0 18px; border: none; border-radius: 6px; background: #E6E4DE; color: #0D0F10; font: inherit; font-weight: 600">Move</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":280}}'>
var PAPER='#E6E4DE',RED='#E0473E',MUTE='#8A8C8E';
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function ss(a,b,x){x=(x-a)/(b-a);x=x<0?0:x>1?1:x;return x*x*(3-2*x);}
function n3(x,y,z){var l=Math.hypot(x,y,z)||1;return[x/l,y/l,z/l];}
function setup(el,W,H){var d=window.devicePixelRatio||1;el.width=Math.round(W*d);el.height=Math.round(H*d);var ctx=el.getContext('2d');ctx.setTransform(d,0,0,d,0,0);return ctx;}
function track(el,W,H){var P={x:null,y:null};el.addEventListener('pointermove',function(e){var r=el.getBoundingClientRect();P.x=(e.clientX-r.left)*W/r.width;P.y=(e.clientY-r.top)*H/r.height;});el.addEventListener('pointerleave',function(){P.x=null;});return P;}
function loop(fn){var last=performance.now(),id,on=true;function f(t){if(!on)return;var dt=Math.min(0.033,Math.max(0,(t-last)/1000));last=t;fn(dt,t/1000);id=requestAnimationFrame(f);}id=requestAnimationFrame(f);return function(){on=false;cancelAnimationFrame(id);};}
function find(sel,cb){var tries=0;(function look(){var el=document.querySelector(sel);if(el)cb(el);else if(tries++<240)requestAnimationFrame(look);})();}
function put(p,x,y,b,C){if(b<0.015)return;var r=C/2*Math.min(1.05,Math.sqrt(b));p.moveTo(x+r,y);p.arc(x,y,r,0,6.2832);}
var LGT=n3(-0.45,-0.55,0.7),HV=n3(LGT[0],LGT[1],LGT[2]+1);
function mkEye(x,y,R,r){return{x:x,y:y,R:R,yaw:0,pitch:0,ty:0,tp:0,ry:0,rp:0,next:r()*2,dart:0,bt:-1,nb:1+r()*4,ph:r()*6.283,spin:r()*6.283,lid:0,r:r};}
function eyeStep(E,dt,t,tx,ty){var r=E.r;if(t>E.next){E.next=t+0.4+r()*2.4;E.dart=r()<0.35?t+0.3+r()*0.6:0;E.ry=(r()-0.5)*1.9;E.rp=(r()-0.5)*1.3;}
  if(tx!=null&&t>E.dart){var g=n3(tx-E.x,ty-E.y,120);E.ty=Math.atan2(g[0],g[2]);E.tp=Math.asin(g[1]);}else{E.ty=E.ry;E.tp=E.rp;}
  var k=Math.min(1,dt*18);E.yaw+=(E.ty-E.yaw)*k;E.pitch+=(E.tp-E.pitch)*k;
  if(t>E.nb&&E.bt<0)E.bt=t;E.lid=0;if(E.bt>=0){var u=(t-E.bt)/0.2;if(u>=1){E.bt=-1;E.nb=t+2+r()*5;}else E.lid=Math.sin(Math.PI*u);}}
function eyeDraw(main,acc,E,C,t,W,H){var cx=E.x+Math.sin(t*0.7+E.ph)*2,cy=E.y+Math.cos(t*0.9+E.ph)*1.5,R=E.R,lid=E.lid,cp=Math.cos(E.pitch),gx=Math.sin(E.yaw)*cp,gy=Math.sin(E.pitch),gz=Math.cos(E.yaw)*cp;
  var i0=Math.max(0,Math.floor((cx-R)/C)),i1=Math.min(Math.floor(W/C)-1,Math.ceil((cx+R)/C)),j0=Math.max(0,Math.floor((cy-R)/C)),j1=Math.min(Math.floor(H/C)-1,Math.ceil((cy+R)/C));
  for(var j=j0;j<=j1;j++)for(var i=i0;i<=i1;i++){var px=(i+0.5)*C,py=(j+0.5)*C,dx=(px-cx)/R,dy=(py-cy)/R,d2=dx*dx+dy*dy;if(d2>1)continue;
    var z=Math.sqrt(1-d2),lam=Math.max(0,dx*LGT[0]+dy*LGT[1]+z*LGT[2]),sp=Math.pow(Math.max(0,dx*HV[0]+dy*HV[1]+z*HV[2]),48),b,isI=false;
    if(Math.abs(dy)>1-lid)b=0.05+0.3*lam;
    else{var ca=dx*gx+dy*gy+z*gz;if(ca>0.955)b=sp*0.35;else if(ca>0.83){var ang=Math.atan2(dy-gy*ca,dx-gx*ca);b=(0.32+0.48*lam)*(0.72+0.28*Math.sin(ang*14+E.spin))*ss(0.83,0.85,ca)+sp*0.3;isI=true;}else b=(0.08+0.72*lam)*(0.55+0.45*Math.sqrt(z))+sp*0.3;}
    put(isI?acc:main,px,py,b,C);}}
function dotRect(ctx,x,y,w,h){var n=Math.floor((w+h)*2/5);for(var k=0;k<n;k++){var u=k/n*(w*2+h*2),px,py;if(u<w){px=x+u;py=y;}else if(u<w+h){px=x+w;py=y+u-w;}else if(u<w*2+h){px=x+w-(u-w-h);py=y+h;}else{px=x;py=y+h-(u-w*2-h);}ctx.beginPath();ctx.arc(px,py,1.1,0,6.2832);ctx.fill();}}
function start(el){
  if(el.__inkStop)el.__inkStop();
  var W=392,H=76,ctx=setup(el,W,H),P=track(el,W,H),r=rng(44),fx=196,fy=36;
  var eyes=[[40,30,18],[92,54,13],[128,22,11],[268,24,12],[306,50,16],[356,30,19]].map(function(a){return mkEye(a[0],a[1],a[2],r);});
  var stop=loop(function(dt,t){
    ctx.clearRect(0,0,W,H);ctx.fillStyle=MUTE;
    for(var k=0;k<4;k++)dotRect(ctx,fx-34+k*14,fy-18+k*3,26,32);
    ctx.font='500 10px "JetBrains Mono", monospace';ctx.textAlign='center';ctx.fillText('~/Downloads',fx,fy+34);ctx.textAlign='left';
    var main=new Path2D(),acc=new Path2D(),tx=P.x!=null?P.x:fx,ty=P.x!=null?P.y:fy;
    for(var e=0;e<eyes.length;e++){eyeStep(eyes[e],dt,t,tx,ty);eyeDraw(main,acc,eyes[e],3,t,W,H);}
    ctx.fillStyle=PAPER;ctx.fill(main);ctx.fillStyle=RED;ctx.fill(acc);
  });
  el.__inkStop=stop;return stop;
}
class Component extends DCLogic {
  componentDidMount(){var self=this;find('canvas[data-ink="dlg"]',function(el){self.s1=start(el);});}
  componentWillUnmount(){if(this.s1)this.s1();}
  renderVals(){return{};}
}
</script>
</body>
</html>
