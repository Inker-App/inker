<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Popover, empty</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E6E4DE}a:hover{color:#fff}
</style>
</helmet>
<div style="width: 360px; height: 500px; box-sizing: border-box; display: flex; flex-direction: column; background: #0D0F10; color: #E6E4DE; font-family: 'Archivo', sans-serif; font-size: 13px; line-height: 1.4; border: 1px solid rgba(230,228,222,0.14); border-radius: 12px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 12px 0 16px; border-bottom: 1px solid rgba(230,228,222,0.14)">
    <canvas data-ink="lock" role="img" aria-label="Inker" style="display: block; width: 100px; height: 20px"></canvas>
    <button type="button" aria-label="Settings" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: none; background: transparent; color: #8A8C8E">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="2.2"></circle><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"></path></svg>
    </button>
  </div>
  <div style="flex: 1; padding: 16px; display: flex">
    <div style="position: relative; width: 328px; height: 384px">
      <canvas data-ink="empty" role="img" aria-label="Drop zone. In the dark, a faint ink pattern grows and a few eyeballs drift, looking for something to see." style="display: block; width: 328px; height: 384px"></canvas>
      <div style="position: absolute; left: 0; right: 0; top: 160px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; pointer-events: none">
        <div style="font-size: 15px; font-weight: 600; font-stretch: 112%">Drop files or folders</div>
        <div style="font-size: 12px; color: #8A8C8E; max-width: 220px">They move into ~/Private. You get a <span style="font-family: 'JetBrains Mono', monospace; color: #E6E4DE">🐙/</span> handle to paste.</div>
      </div>
    </div>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 16px; border-top: 1px solid rgba(230,228,222,0.14); font-size: 11px; color: #8A8C8E">
    <span>Nothing filed yet</span>
    <span>MCP running</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":500}}'>
var PAPER='#E6E4DE',RED='#E0473E',MUTE='#8A8C8E',PANEL='#08090A';
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function ss(a,b,x){x=(x-a)/(b-a);x=x<0?0:x>1?1:x;return x*x*(3-2*x);}
function n3(x,y,z){var l=Math.hypot(x,y,z)||1;return[x/l,y/l,z/l];}
function setup(el,W,H){var d=window.devicePixelRatio||1;el.width=Math.round(W*d);el.height=Math.round(H*d);var ctx=el.getContext('2d');ctx.setTransform(d,0,0,d,0,0);return ctx;}
function track(el,W,H){var P={x:null,y:null};el.addEventListener('pointermove',function(e){var r=el.getBoundingClientRect();P.x=(e.clientX-r.left)*W/r.width;P.y=(e.clientY-r.top)*H/r.height;});el.addEventListener('pointerleave',function(){P.x=null;});return P;}
function loop(fn){var last=performance.now(),id,on=true;function f(t){if(!on)return;var dt=Math.min(0.033,Math.max(0,(t-last)/1000));last=t;fn(dt,t/1000);id=requestAnimationFrame(f);}id=requestAnimationFrame(f);return function(){on=false;cancelAnimationFrame(id);};}
function find(sel,cb){var tries=0;(function look(){var el=document.querySelector(sel);if(el)cb(el);else if(tries++<240)requestAnimationFrame(look);})();}
function put(p,x,y,b,C){if(b<0.015)return;var r=C/2*Math.min(1.05,Math.sqrt(b));p.moveTo(x+r,y);p.arc(x,y,r,0,6.2832);}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
/* ink grid + lockup */
function bits(rows){var h=rows.length,w=0,x,y;for(y=0;y<h;y++)w=Math.max(w,rows[y].length);var a=new Float32Array(w*h);for(y=0;y<h;y++)for(x=0;x<w;x++)a[y*w+x]=rows[y].charAt(x)==='#'?1:0;return{w:w,h:h,a:a};}
function field(b,cell,o){o=o||{};var n=b.w*b.h;return{w:b.w,h:b.h,base:b.a,v:new Float32Array(b.a),cell:cell,gap:cell*0.1,ox:o.ox||0,oy:o.oy||0,dx:new Float32Array(n),dy:new Float32Array(n)};}
function poly(ctx,p){var s=0,i,n=p.length;for(i=0;i<n;i++){var q=p[(i+1)%n];s+=p[i][0]*q[1]-q[0]*p[i][1];}if(s<0)p.reverse();ctx.moveTo(p[0][0],p[0][1]);for(i=1;i<n;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();}
function ctr(F,i){var c=F.cell;return[F.ox+(i%F.w)*c+c/2+F.dx[i],F.oy+((i/F.w)|0)*c+c/2+F.dy[i]];}
function bridge(ctx,F,i,j,R){var rb=R*ss(0.55,0.9,Math.min(F.v[i],F.v[j]));if(rb<=0)return;var a=ctr(F,i),b=ctr(F,j),ex=b[0]-a[0],ey=b[1]-a[1],L=Math.hypot(ex,ey);if(L<0.001||L>F.cell*1.6)return;var nx=-ey/L*rb,ny=ex/L*rb;poly(ctx,[[a[0]+nx,a[1]+ny],[b[0]+nx,b[1]+ny],[b[0]-nx,b[1]-ny],[a[0]-nx,a[1]-ny]]);}
function drawInk(ctx,F,col,diag){var w=F.w,h=F.h,R=F.cell/2-F.gap/2,x,y,i;ctx.beginPath();for(y=0;y<h;y++)for(x=0;x<w;x++){i=y*w+x;var v=F.v[i];if(v<0.02)continue;var c=ctr(F,i),r=R*Math.min(1,v);ctx.moveTo(c[0]+r,c[1]);ctx.arc(c[0],c[1],r,0,6.2832);var jr=x<w-1&&F.v[i+1]>0.02,jd=y<h-1&&F.v[i+w]>0.02;if(jr)bridge(ctx,F,i,i+1,R);if(jd)bridge(ctx,F,i,i+w,R);if(diag&&y<h-1){if(x<w-1&&F.base[i+w+1]>0&&!F.base[i+1]&&!F.base[i+w])bridge(ctx,F,i,i+w+1,R);if(x>0&&F.base[i+w-1]>0&&!F.base[i-1]&&!F.base[i+w])bridge(ctx,F,i,i+w-1,R);}if(jr&&jd&&Math.min(v,F.v[i+1],F.v[i+w],F.v[i+w+1])>0.88)poly(ctx,[ctr(F,i),ctr(F,i+1),ctr(F,i+w+1),ctr(F,i+w)]);}ctx.fillStyle=col;ctx.fill();}
var LET={I:['###','.#.','.#.','.#.','.#.','.#.','###'],N:['#...#','##..#','#.#.#','#.#.#','#..##','#...#','#...#'],K:['#...#','#..#.','#.#..','##...','#.#..','#..#.','#...#'],E:['#####','#....','#....','####.','#....','#....','#####'],R:['####.','#...#','#...#','####.','#.#..','#..#.','#...#']};
function word(s){var rows=[];for(var y=0;y<7;y++){var r='';for(var j=0;j<s.length;j++){if(j)r+='.';r+=LET[s.charAt(j)][y];}rows.push(r);}return bits(rows);}
var MARK=['.#####.','#######','##.#.##','#######','#.#.#.#','#.#.#.#','.#.#.#.'];
function startLock(el){if(el.__inkStop)el.__inkStop();var W=100,H=20,ctx=setup(el,W,H),c=2.6,m=field(bits(MARK),c,{ox:0,oy:1}),wd=field(word('INKER'),c,{ox:28,oy:1});
  var stop=loop(function(dt,t){for(var i=0;i<m.v.length;i++){var y=(i/m.w)|0;m.v[i]=m.base[i]*(0.9+0.1*Math.sin(t*1.6-y*0.6));}ctx.clearRect(0,0,W,H);drawInk(ctx,m,PAPER,false);drawInk(ctx,wd,PAPER,true);});el.__inkStop=stop;return stop;}
/* eyes */
var LGT=n3(-0.45,-0.55,0.7),HV=n3(LGT[0],LGT[1],LGT[2]+1);
function mkEye(x,y,R,r){return{x:x,y:y,hx:x,hy:y,R:R,yaw:0,pitch:0,ty:0,tp:0,ry:0,rp:0,next:r()*2,dart:0,bt:-1,nb:1+r()*4,ph:r()*6.283,spin:r()*6.283,lid:0,r:r};}
function eyeStep(E,dt,t,tx,ty){var r=E.r;if(t>E.next){E.next=t+0.4+r()*2.4;E.dart=r()<0.45?t+0.3+r()*0.8:0;E.ry=(r()-0.5)*1.9;E.rp=(r()-0.5)*1.3;}
  if(tx!=null&&t>E.dart){var g=n3(tx-E.x,ty-E.y,160);E.ty=Math.atan2(g[0],g[2]);E.tp=Math.asin(g[1]);}else{E.ty=E.ry;E.tp=E.rp;}
  var k=Math.min(1,dt*18);E.yaw+=(E.ty-E.yaw)*k;E.pitch+=(E.tp-E.pitch)*k;
  if(t>E.nb&&E.bt<0)E.bt=t;E.lid=0;if(E.bt>=0){var u=(t-E.bt)/0.2;if(u>=1){E.bt=-1;E.nb=t+2+r()*5;}else E.lid=Math.sin(Math.PI*u);}}
function eyeDraw(main,acc,E,C,t,W,H,squint){var cx=E.x+Math.sin(t*0.7+E.ph)*2,cy=E.y+Math.cos(t*0.9+E.ph)*1.5,R=E.R,lid=Math.max(E.lid,squint||0),cp=Math.cos(E.pitch),gx=Math.sin(E.yaw)*cp,gy=Math.sin(E.pitch),gz=Math.cos(E.yaw)*cp;
  var i0=Math.max(0,Math.floor((cx-R)/C)),i1=Math.min(Math.floor(W/C)-1,Math.ceil((cx+R)/C)),j0=Math.max(0,Math.floor((cy-R)/C)),j1=Math.min(Math.floor(H/C)-1,Math.ceil((cy+R)/C));
  for(var j=j0;j<=j1;j++)for(var i=i0;i<=i1;i++){var px=(i+0.5)*C,py=(j+0.5)*C,dx=(px-cx)/R,dy=(py-cy)/R,d2=dx*dx+dy*dy;if(d2>1)continue;
    var z=Math.sqrt(1-d2),lam=Math.max(0,dx*LGT[0]+dy*LGT[1]+z*LGT[2]),sp=Math.pow(Math.max(0,dx*HV[0]+dy*HV[1]+z*HV[2]),48),b,isI=false;
    if(Math.abs(dy)>1-lid)b=0.05+0.3*lam;
    else{var ca=dx*gx+dy*gy+z*gz;if(ca>0.955)b=sp*0.35;else if(ca>0.83){var ang=Math.atan2(dy-gy*ca,dx-gx*ca);b=(0.32+0.48*lam)*(0.72+0.28*Math.sin(ang*14+E.spin))*ss(0.83,0.85,ca)+sp*0.3;isI=true;}else b=(0.08+0.72*lam)*(0.55+0.45*Math.sqrt(z))+sp*0.3;}
    put(isI?acc:main,px,py,b,C);}}
/* reaction-diffusion */
function makeRD(gw,gh,seedCount,seed){var n=gw*gh,U=new Float32Array(n).fill(1),V=new Float32Array(n),U2=new Float32Array(n),V2=new Float32Array(n),r=rng(seed);
  function drop(cx,cy,s){for(var y=-s;y<=s;y++)for(var x=-s;x<=s;x++){var X=((cx+x)%gw+gw)%gw,Y=((cy+y)%gh+gh)%gh;V[Y*gw+X]=1;}}
  function step(){var f=0.0545,k=0.062;for(var y=0;y<gh;y++){var ym=((y-1+gh)%gh)*gw,y0=y*gw,yp=((y+1)%gh)*gw;for(var x=0;x<gw;x++){var xm=(x-1+gw)%gw,xp=(x+1)%gw,i=y0+x;var lu=-U[i]+0.2*(U[y0+xm]+U[y0+xp]+U[ym+x]+U[yp+x])+0.05*(U[ym+xm]+U[ym+xp]+U[yp+xm]+U[yp+xp]);var lv=-V[i]+0.2*(V[y0+xm]+V[y0+xp]+V[ym+x]+V[yp+x])+0.05*(V[ym+xm]+V[ym+xp]+V[yp+xm]+V[yp+xp]);var u=U[i],v=V[i],uvv=u*v*v;U2[i]=u+(lu-uvv+f*(1-u));V2[i]=v+(0.5*lv+uvv-(k+f)*v);}}var t=U;U=U2;U2=t;t=V;V=V2;V2=t;}
  for(var q=0;q<seedCount;q++)drop(r()*gw|0,r()*gh|0,1);return{drop:drop,step:step,V:function(){return V;}};}

function startZone(el){
  if(el.__inkStop)el.__inkStop();
  var W=328,H=384,ctx=setup(el,W,H),P=track(el,W,H),r=rng(31),C=4,gw=W/C|0,gh=H/C|0,rd=makeRD(gw,gh,10,6);for(var q=0;q<300;q++)rd.step();
  var eyes=[mkEye(62,74,20,r),mkEye(268,300,24,r),mkEye(250,64,14,r),mkEye(58,320,12,r)];
  var stop=loop(function(dt,t){
    if(P.x!=null)rd.drop((P.x/C)|0,(P.y/C)|0,0);
    for(var s=0;s<4;s++)rd.step();
    ctx.clearRect(0,0,W,H);ctx.fillStyle=PANEL;rrect(ctx,0,0,W,H,10);ctx.fill();
    var V=rd.V(),bg=new Path2D();for(var j=0;j<gh;j++)for(var i=0;i<gw;i++)put(bg,(i+0.5)*C,(j+0.5)*C,ss(0.1,0.28,V[j*gw+i])*0.9,C);
    ctx.save();ctx.globalAlpha=0.09;ctx.fillStyle=PAPER;ctx.fill(bg);ctx.restore();
    ctx.save();ctx.setLineDash([5,6]);ctx.strokeStyle='rgba(230,228,222,0.35)';ctx.lineWidth=1.25;rrect(ctx,6,6,W-12,H-12,8);ctx.stroke();ctx.restore();
    var main=new Path2D(),acc=new Path2D();
    for(var e=0;e<eyes.length;e++){var E=eyes[e];E.x=E.hx+Math.sin(t*0.21+E.ph)*10;E.y=E.hy+Math.cos(t*0.17+E.ph)*8;eyeStep(E,dt,t,P.x,P.y);eyeDraw(main,acc,E,3,t,W,H,0);}
    ctx.fillStyle=PAPER;ctx.fill(main);ctx.fillStyle=RED;ctx.fill(acc);
  });
  el.__inkStop=stop;return stop;
}
class Component extends DCLogic {
  componentDidMount(){var self=this;find('canvas[data-ink="lock"]',function(el){self.s1=startLock(el);});find('canvas[data-ink="empty"]',function(el){self.s2=startZone(el);});}
  componentWillUnmount(){if(this.s1)this.s1();if(this.s2)this.s2();}
  renderVals(){return{};}
}
</script>
</body>
</html>
