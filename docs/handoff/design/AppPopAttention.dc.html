<!doctype html>

<body>
<x-dc>
<helmet>

<style>

a{color:#E6E4DE}a:hover{color:#fff}
</style>
</helmet>
<div style="width: 360px; height: 500px; box-sizing: border-box; display: flex; flex-direction: column; background: #0D0F10; color: #E6E4DE; font-family: 'Archivo', sans-serif; font-size: 13px; line-height: 1.4; border: 1px solid rgba(230,228,222,0.14); border-radius: 12px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 12px 0 16px; border-bottom: 1px solid rgba(230,228,222,0.14)">
    <div style="display: flex; align-items: center; gap: 10px">
      <canvas data-ink="lock" role="img" aria-label="Inker" style="display: block; width: 100px; height: 20px"></canvas>
      <span aria-label="1 item needs you" style="display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #E6E4DE; color: #0D0F10; font-size: 11px; font-weight: 700">1</span>
    </div>
    <button type="button" aria-label="Settings" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: none; background: transparent; color: #8A8C8E">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="2.2"></circle><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"></path></svg>
    </button>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; padding: 4px 16px 0; overflow: hidden">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 0">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600">🐙/taxes-2025</span>
        <span style="font-size: 11px; color: #8A8C8E">4 files · 3 ready · 1 needs you</span>
      </div>
      <button type="button" style="height: 28px; padding: 0 12px; border: 1px solid rgba(230,228,222,0.3); border-radius: 6px; background: transparent; font: inherit; font-size: 12px; color: #E6E4DE">Copy</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px solid rgba(230,228,222,0.55); border-radius: 10px">
      <div style="display: flex; justify-content: space-between; font-size: 12px"><span style="font-weight: 600">closing-statement.pdf</span><span style="color: #8A8C8E">page 3 of 11</span></div>
      <canvas data-ink="peek" role="img" aria-label="An eyeball squints at a nine-digit number the scanner wasn't sure about" style="display: block; width: 302px; height: 84px; background: #08090A; border-radius: 6px"></canvas>
      <div style="font-size: 13px">Looks like an account number, but the scan is rough. Ink it?</div>
      <div style="display: flex; gap: 8px; align-items: center">
        <button type="button" style="height: 30px; padding: 0 14px; border: none; border-radius: 6px; background: #E6E4DE; color: #0D0F10; font: inherit; font-size: 12px; font-weight: 600">Ink it</button>
        <button type="button" style="height: 30px; padding: 0 14px; border: 1px solid rgba(230,228,222,0.3); border-radius: 6px; background: transparent; font: inherit; font-size: 12px; color: #E6E4DE">Leave it</button>
        <button type="button" style="margin-left: auto; height: 30px; padding: 0 6px; border: none; background: transparent; font: inherit; font-size: 12px; color: #8A8C8E; text-decoration: underline">Open file</button>
      </div>
      <div style="font-size: 11px; color: #8A8C8E">Handle is held until you answer. Agents asking for it are told "pending".</div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 0 8px 12px; border-bottom: 1px solid rgba(230,228,222,0.08)">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px">🐙/w2-acme-2025</span><span style="font-size: 11px; color: #8A8C8E">ready</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 0 8px 12px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px">🐙/1099int-chase-2025</span><span style="font-size: 11px; color: #8A8C8E">ready</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 16px; border-top: 1px solid rgba(230,228,222,0.14); font-size: 11px; color: #8A8C8E">
    <span>1 waiting on you</span>
    <span>MCP running</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":500}}'>
var PAPER='#E6E4DE',RED='#E0473E',MUTE='#8A8C8E';
function ss(a,b,x){x=(x-a)/(b-a);x=x<0?0:x>1?1:x;return x*x*(3-2*x);}
function n3(x,y,z){var l=Math.hypot(x,y,z)||1;return[x/l,y/l,z/l];}
function setup(el,W,H){var d=window.devicePixelRatio||1;el.width=Math.round(W*d);el.height=Math.round(H*d);var ctx=el.getContext('2d');ctx.setTransform(d,0,0,d,0,0);return ctx;}
function track(el,W,H){var P={x:null,y:null};el.addEventListener('pointermove',function(e){var r=el.getBoundingClientRect();P.x=(e.clientX-r.left)*W/r.width;P.y=(e.clientY-r.top)*H/r.height;});el.addEventListener('pointerleave',function(){P.x=null;});return P;}
function loop(fn){var last=performance.now(),id,on=true;function f(t){if(!on)return;var dt=Math.min(0.033,Math.max(0,(t-last)/1000));last=t;fn(dt,t/1000);id=requestAnimationFrame(f);}id=requestAnimationFrame(f);return function(){on=false;cancelAnimationFrame(id);};}
function find(sel,cb){var tries=0;(function look(){var el=document.querySelector(sel);if(el)cb(el);else if(tries++<240)requestAnimationFrame(look);})();}
function put(p,x,y,b,C){if(b<0.015)return;var r=C/2*Math.min(1.05,Math.sqrt(b));p.moveTo(x+r,y);p.arc(x,y,r,0,6.2832);}
function bits(rows){var h=rows.length,w=0,x,y;for(y=0;y<h;y++)w=Math.max(w,rows[y].length);var a=new Float32Array(w*h);for(y=0;y<h;y++)for(x=0;x<w;x++)a[y*w+x]=rows[y].charAt(x)==='#'?1:0;return{w:w,h:h,a:a};}
function field(b,cell,o){o=o||{};var n=b.w*b.h;return{w:b.w,h:b.h,base:b.a,v:new Float32Array(b.a),cell:cell,gap:cell*0.1,ox:o.ox||0,oy:o.oy||0,dx:new Float32Array(n),dy:new Float32Array(n)};}
function poly(ctx,p){var s=0,i,n=p.length;for(i=0;i<n;i++){var q=p[(i+1)%n];s+=p[i][0]*q[1]-q[0]*p[i][1];}if(s<0)p.reverse();ctx.moveTo(p[0][0],p[0][1]);for(i=1;i<n;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();}
function ctr(F,i){var c=F.cell;return[F.ox+(i%F.w)*c+c/2+F.dx[i],F.oy+((i/F.w)|0)*c+c/2+F.dy[i]];}
function bridge(ctx,F,i,j,R){var rb=R*ss(0.55,0.9,Math.min(F.v[i],F.v[j]));if(rb<=0)return;var a=ctr(F,i),b=ctr(F,j),ex=b[0]-a[0],ey=b[1]-a[1],L=Math.hypot(ex,ey);if(L<0.001||L>F.cell*1.6)return;var nx=-ey/L*rb,ny=ex/L*rb;poly(ctx,[[a[0]+nx,a[1]+ny],[b[0]+nx,b[1]+ny],[b[0]-nx,b[1]-ny],[a[0]-nx,a[1]-ny]]);}
function drawInk(ctx,F,col,diag){var w=F.w,h=F.h,R=F.cell/2-F.gap/2,x,y,i;ctx.beginPath();for(y=0;y<h;y++)for(x=0;x<w;x++){i=y*w+x;var v=F.v[i];if(v<0.02)continue;var c=ctr(F,i),r=R*Math.min(1,v);ctx.moveTo(c[0]+r,c[1]);ctx.arc(c[0],c[1],r,0,6.2832);var jr=x<w-1&&F.v[i+1]>0.02,jd=y<h-1&&F.v[i+w]>0.02;if(jr)bridge(ctx,F,i,i+1,R);if(jd)bridge(ctx,F,i,i+w,R);if(diag&&y<h-1){if(x<w-1&&F.base[i+w+1]>0&&!F.base[i+1]&&!F.base[i+w])bridge(ctx,F,i,i+w+1,R);if(x>0&&F.base[i+w-1]>0&&!F.base[i-1]&&!F.base[i+w])bridge(ctx,F,i,i+w-1,R);}if(jr&&jd&&Math.min(v,F.v[i+1],F.v[i+w],F.v[i+w+1])>0.88)poly(ctx,[ctr(F,i),ctr(F,i+1),ctr(F,i+w+1),ctr(F,i+w)]);}ctx.fillStyle=col;ctx.fill();}
var LET={I:['###','.#.','.#.','.#.','.#.','.#.','###'],N:['#...#','##..#','#.#.#','#.#.#','#..##','#...#','#...#'],K:['#...#','#..#.','#.#..','##...','#.#..','#..#.','#...#'],E:['#####','#....','#....','####.','#....','#....','#####'],R:['####.','#...#','#...#','####.','#.#..','#..#.','#...#']};
function word(s){var rows=[];for(var y=0;y<7;y++){var r='';for(var j=0;j<s.length;j++){if(j)r+='.';r+=LET[s.charAt(j)][y];}rows.push(r);}return bits(rows);}
var MARK=['.#####.','#######','##.#.##','#######','#.#.#.#','#.#.#.#','.#.#.#.'];
function startLock(el){if(el.__inkStop)el.__inkStop();var W=100,H=20,ctx=setup(el,W,H),c=2.6,m=field(bits(MARK),c,{ox:0,oy:1}),wd=field(word('INKER'),c,{ox:28,oy:1});
  var stop=loop(function(dt,t){for(var i=0;i<m.v.length;i++){var y=(i/m.w)|0;m.v[i]=m.base[i]*(0.9+0.1*Math.sin(t*1.6-y*0.6));}ctx.clearRect(0,0,W,H);drawInk(ctx,m,PAPER,false);drawInk(ctx,wd,PAPER,true);});el.__inkStop=stop;return stop;}
var LGT=n3(-0.45,-0.55,0.7),HV=n3(LGT[0],LGT[1],LGT[2]+1);
function eyeDraw(main,acc,cx,cy,R,gx,gy,gz,lid,spin,C,W,H){var i0=Math.max(0,Math.floor((cx-R)/C)),i1=Math.min(Math.floor(W/C)-1,Math.ceil((cx+R)/C)),j0=Math.max(0,Math.floor((cy-R)/C)),j1=Math.min(Math.floor(H/C)-1,Math.ceil((cy+R)/C));
  for(var j=j0;j<=j1;j++)for(var i=i0;i<=i1;i++){var px=(i+0.5)*C,py=(j+0.5)*C,dx=(px-cx)/R,dy=(py-cy)/R,d2=dx*dx+dy*dy;if(d2>1)continue;var z=Math.sqrt(1-d2),lam=Math.max(0,dx*LGT[0]+dy*LGT[1]+z*LGT[2]),sp=Math.pow(Math.max(0,dx*HV[0]+dy*HV[1]+z*HV[2]),48),b,isI=false;
    if(Math.abs(dy)>1-lid)b=0.05+0.3*lam;else{var ca=dx*gx+dy*gy+z*gz;if(ca>0.955)b=sp*0.35;else if(ca>0.83){var ang=Math.atan2(dy-gy*ca,dx-gx*ca);b=(0.32+0.48*lam)*(0.72+0.28*Math.sin(ang*14+spin))*ss(0.83,0.85,ca)+sp*0.3;isI=true;}else b=(0.08+0.72*lam)*(0.55+0.45*Math.sqrt(z))+sp*0.3;}
    put(isI?acc:main,px,py,b,C);}}

function startPeek(el){
  if(el.__inkStop)el.__inkStop();
  var W=302,H=84,ctx=setup(el,W,H),P=track(el,W,H),yaw=0,pitch=0;
  var stop=loop(function(dt,t){
    ctx.clearRect(0,0,W,H);
    ctx.font='500 12px "JetBrains Mono", monospace';ctx.fillStyle=MUTE;ctx.fillText('…wire to',96,30);
    var dx0=96,dy0=56,txt='021000021',cw=ctx.measureText('0').width,sw=txt.length*cw;
    ctx.fillStyle=PAPER;ctx.fillText(txt,dx0,dy0);ctx.fillStyle=MUTE;ctx.fillText(' ref 4471…',dx0+sw,dy0);
    var pulse=0.5+0.5*Math.sin(t*3);ctx.fillStyle='rgba(230,228,222,'+(0.35+0.35*pulse)+')';
    var bx=dx0-6,by=dy0-15,bw=sw+12,bh=22,n=Math.floor((bw+bh)*2/6);
    for(var k=0;k<n;k++){var u=k/n*(bw*2+bh*2),px,py;if(u<bw){px=bx+u;py=by;}else if(u<bw+bh){px=bx+bw;py=by+u-bw;}else if(u<bw*2+bh){px=bx+bw-(u-bw-bh);py=by+bh;}else{px=bx;py=by+bh-(u-bw*2-bh);}ctx.beginPath();ctx.arc(px,py,1.1,0,6.2832);ctx.fill();}
    var cx=44+Math.sin(t*0.9)*1.5,cy=42,tx=P.x!=null?P.x:dx0+sw*(0.5+0.45*Math.sin(t*1.3)),ty=P.x!=null?P.y:dy0-5;
    var g=n3(tx-cx,ty-cy,60),wy=Math.atan2(g[0],g[2]),wp=Math.asin(g[1]),k2=Math.min(1,dt*14);yaw+=(wy-yaw)*k2;pitch+=(wp-pitch)*k2;
    var cp=Math.cos(pitch),lid=0.3+0.1*Math.sin(t*2.3),bl=t%4.1;if(bl<0.2)lid=Math.max(lid,Math.sin(Math.PI*bl/0.2));
    var main=new Path2D(),acc=new Path2D();eyeDraw(main,acc,cx,cy,32,Math.sin(yaw)*cp,Math.sin(pitch),Math.cos(yaw)*cp,lid,2.1,4,W,H);
    ctx.fillStyle=PAPER;ctx.fill(main);ctx.fillStyle=RED;ctx.fill(acc);
  });
  el.__inkStop=stop;return stop;
}
class Component extends DCLogic {
  componentDidMount(){var self=this;find('canvas[data-ink="lock"]',function(el){self.s1=startLock(el);});find('canvas[data-ink="peek"]',function(el){self.s2=startPeek(el);});}
  componentWillUnmount(){if(this.s1)this.s1();if(this.s2)this.s2();}
  renderVals(){return{};}
}
</script>
