name: release

# Builds INKER.app, the inker CLI and the Claude Desktop bundle on a macOS
# runner and publishes them as a GitHub pre-release. The dev box is Linux,
# so this is where the Swift shell actually compiles.
#
# Trigger by pushing a tag like v0.0, or by hand with a version input.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (tag without the v, e.g. 0.0)"
        required: true
        default: "0.0"
      publish:
        description: "Create the GitHub release (false = build only)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "26.0"

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchains
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # Developer ID signing when the repository has the certificate; ad-hoc
      # otherwise, so a fork or a build-only run still works. Secrets:
      # MACOS_CERT_P12 (base64 of the "Developer ID Application" .p12),
      # MACOS_CERT_PASSWORD, and for notarization NOTARY_KEY_ID,
      # NOTARY_ISSUER_ID, NOTARY_KEY_P8 (an App Store Connect API key).
      # See app/BUILD.md, "Codesigning and notarization".
      - name: Signing identity
        id: sign
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "no certificate secret: ad-hoc signing"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "real=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/inker-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          if [ -z "$IDENTITY" ]; then
            echo "the certificate is not a Developer ID Application certificate" >&2
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "real=true" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"

      - name: Version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rust core (universal CLI)
        working-directory: core
        run: |
          cargo build --release -p inker --target aarch64-apple-darwin
          cargo build --release -p inker --target x86_64-apple-darwin
          mkdir -p ../dist/out
          lipo -create \
            target/aarch64-apple-darwin/release/inker \
            target/x86_64-apple-darwin/release/inker \
            -output ../dist/out/inker
          ../dist/out/inker --help >/dev/null
          # The CLI ships on its own and inside the app and the .mcpb.
          if [ "${{ steps.sign.outputs.real }}" = "true" ]; then
            codesign --force --options runtime --timestamp --sign "${{ steps.sign.outputs.identity }}" ../dist/out/inker
          else
            codesign --force --sign - ../dist/out/inker
          fi
          codesign --verify --strict ../dist/out/inker

      - name: Rust FFI, bindings, xcframework
        working-directory: app
        run: ./scripts/build-rust.sh --universal

      - name: Swift tests
        working-directory: app
        # The static Rust lib prints a linker warning per object file; drop
        # those so compile errors and test failures stay in the log.
        run: |
          set -o pipefail
          swift test 2>&1 | grep -v "ld: warning: object file"

      - name: Swift build and INKER.app
        working-directory: app
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.v.outputs.version }}" Resources/Info.plist
          make app SIGN_IDENTITY="${{ steps.sign.outputs.identity }}"
          # Ship the CLI/shim inside the app bundle so the Desktop config and
          # the .mcpb can point at one place. Named inker-cli: APFS is
          # case-insensitive, so "inker" would overwrite the app's "INKER".
          cp ../dist/out/inker build/INKER.app/Contents/MacOS/inker-cli
          # Re-sign now that the bundle has a second executable in it.
          make sign SIGN_IDENTITY="${{ steps.sign.outputs.identity }}"
          ls -la build/INKER.app/Contents/MacOS
          test -s build/INKER.app/Contents/MacOS/INKER && test -s build/INKER.app/Contents/MacOS/inker-cli
          test -s build/INKER.app/Contents/Resources/AppIcon.icns
          codesign -dvv build/INKER.app 2>&1 | grep -E "Identifier|Signature|Sealed|Authority|Runtime"
          spctl --assess --type execute --verbose=4 build/INKER.app || echo "(not notarized yet)"

      # Notarize the app and the CLI, then staple the app so Gatekeeper
      # passes it offline. A bare binary cannot be stapled; its ticket is
      # looked up online.
      - name: Notarize
        if: steps.sign.outputs.real == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          if [ -z "$NOTARY_KEY_P8" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER_ID" ]; then
            echo "signed but not notarized: NOTARY_KEY_ID, NOTARY_ISSUER_ID and NOTARY_KEY_P8 are not all set" >&2
            exit 1
          fi
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$NOTARY_KEY_P8" > "$KEY"
          notarize() {
            xcrun notarytool submit "$1" --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
              --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
            STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary.json")"
            if [ "$STATUS" != "Accepted" ]; then
              ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/notary.json")"
              xcrun notarytool log "$ID" --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
              exit 1
            fi
          }
          ditto -c -k --keepParent app/build/INKER.app "$RUNNER_TEMP/INKER-notarize.zip"
          notarize "$RUNNER_TEMP/INKER-notarize.zip"
          xcrun stapler staple app/build/INKER.app
          xcrun stapler validate app/build/INKER.app
          spctl --assess --type execute --verbose=4 app/build/INKER.app
          ditto -c -k dist/out/inker "$RUNNER_TEMP/inker-cli-notarize.zip"
          notarize "$RUNNER_TEMP/inker-cli-notarize.zip"
          rm -f "$KEY"

      # Render check: every popover screen as a PNG (app/BUILD.md, "Render
      # check"). Metal eyes and the octopus come out blank. A failure here
      # does not block the release; look at the log and the artifact.
      - name: Snapshots
        continue-on-error: true
        working-directory: app
        run: |
          build/INKER.app/Contents/MacOS/INKER --snapshots build/snapshots
          ls -la build/snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ steps.v.outputs.version }}
          path: app/build/snapshots
          if-no-files-found: warn

      - name: Claude Desktop bundle (.mcpb)
        run: |
          ./dist/out/inker bundle --out dist/out/inker.mcpb \
            --version "${{ steps.v.outputs.version }}" \
            --binary dist/out/inker
          ls -la dist/out

      # A disk image: open it and drag INKER.app to Applications, no unzip.
      # The app inside is the already stapled one. When signing for real the
      # image is signed and notarized too, so it opens offline.
      - name: Disk image
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          DMG="dist/out/INKER-${{ steps.v.outputs.version }}-macos.dmg"
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          ditto app/build/INKER.app "$STAGE/INKER.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname INKER -srcfolder "$STAGE" -fs HFS+ -format UDZO -ov "$DMG"
          if [ "${{ steps.sign.outputs.real }}" = "true" ]; then
            codesign --force --timestamp --sign "${{ steps.sign.outputs.identity }}" "$DMG"
            if [ -n "$NOTARY_KEY_P8" ] && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER_ID" ]; then
              KEY="$RUNNER_TEMP/AuthKey-dmg.p8"
              printf '%s' "$NOTARY_KEY_P8" > "$KEY"
              xcrun notarytool submit "$DMG" --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait --timeout 30m
              xcrun stapler staple "$DMG"
              xcrun stapler validate "$DMG"
              rm -f "$KEY"
            fi
          fi
          hdiutil verify "$DMG"
          ls -la dist/out

      - name: Package
        run: |
          cd app/build && ditto -c -k --keepParent INKER.app ../../dist/out/INKER-${{ steps.v.outputs.version }}-macos.zip && cd -
          cd dist/out && mv inker inker-${{ steps.v.outputs.version }}-macos-universal && mv inker.mcpb inker-${{ steps.v.outputs.version }}.mcpb && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: inker-${{ steps.v.outputs.version }}
          path: dist/out/*
          if-no-files-found: error

      - name: Publish pre-release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          TAG="v$V"
          if [ "${{ github.event_name }}" != "push" ]; then
            git tag -f "$TAG" && git push -f origin "$TAG"
          fi
          if [ "${{ steps.sign.outputs.real }}" = "true" ]; then
            NOTES="Signed with Developer ID and notarized: open the .dmg and drag INKER.app to Applications (the .zip holds the same app). See docs/stack-decision.md for what works and what does not."
          else
            NOTES="Ad-hoc signed, not notarized. After copying INKER.app out of the .dmg (or unzipping) run \`xattr -dr com.apple.quarantine INKER.app\`, or open it once, then allow it under System Settings > Privacy & Security > Open Anyway. See docs/stack-decision.md for what works and what does not."
          fi
          # A re-run of an existing release replaces its assets and its notes.
          gh release create "$TAG" dist/out/* \
            --title "INKER $V" \
            --prerelease \
            --notes "$NOTES" \
            || { gh release upload "$TAG" dist/out/* --clobber && gh release edit "$TAG" --notes "$NOTES"; }

      # inker.sh names the newest release on its download button. Releases made
      # with the workflow token do not trigger other workflows, so ask for the
      # site build here. Skipped when the secret is not set.
      - name: Rebuild inker.sh
        if: github.event_name == 'push' || inputs.publish
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK"

      - name: Remove the signing keychain
        if: always() && steps.sign.outputs.keychain != ''
        run: security delete-keychain "${{ steps.sign.outputs.keychain }}" || true
