name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (Rust + PII check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # The PII check runs from the repo root so its allowlist paths
      # (samples/synthetic/, docs/handoff/) resolve.
      - name: PII check (whole repo)
        working-directory: .
        run: python3 -I scripts/check-pii.py --all

      - name: PII checker tests
        working-directory: .
        run: python3 -I scripts/test_check_pii.py

      - name: Sample corpus is generated and current
        working-directory: .
        run: python3 -I samples/test_generate.py

  app:
    name: app (Swift shell)
    runs-on: macos-26
    # The Swift shell cannot be compiled on the Linux dev box, so this job is
    # the only compile check of app/ until Ben builds it locally on his Mac.
    # It is allowed to fail while the shell is still a skeleton; drop
    # continue-on-error once it builds cleanly.
    continue-on-error: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: swift build
        run: swift build
