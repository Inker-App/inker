[package]
name = "inker-detect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# GLiNER-PII on ONNX Runtime via gline-rs. Off by default: the default build
# must not depend on ONNX Runtime.
gliner = ["dep:gline-rs", "dep:orp"]

[dependencies]
inker-core.workspace = true
inker-packs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
regex = "1.13.1"
gline-rs = { version = "1.1.0", optional = true }
orp = { version = "1.0.0", optional = true }

[lints]
workspace = true

[dev-dependencies]
inker-extract.workspace = true
camino.workspace = true
tempfile = "3.27.0"
