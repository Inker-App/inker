[package]
name = "inker-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The Swift shell links the static library (via InkerCoreFFI.xcframework).
# cdylib is what uniffi-bindgen reads the interface metadata from; lib keeps
# the crate usable from Rust tests and other workspace crates.
[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "inker_ffi"

[features]
# Enables the bindgen binaries below. Kept off by default so the library
# build (and the static lib the app links) does not pull in clap and friends.
bindgen = ["uniffi/cli"]

# The documented UniFFI pattern: ship the bindgen CLI from the crate itself so
# the generator version always matches the scaffolding version.
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[[bin]]
name = "uniffi-bindgen-swift"
path = "uniffi-bindgen-swift.rs"
required-features = ["bindgen"]

[dependencies]
inker-core.workspace = true
inker-extract.workspace = true
inker-host.workspace = true
inker-ipc.workspace = true
inker-mcp.workspace = true
tokio.workspace = true
tokio-util = "0.7.20"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
camino.workspace = true
chrono.workspace = true
uniffi = { version = "=0.32.2" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
