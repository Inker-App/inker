# The US tax pack. Data, not code: see forms/*.toml for the template schema
# (documented in core/crates/inker-detect/src/template.rs).
name = "tax"
version = "0.1.0"
description = "US federal tax forms: W-2, 1099 family, 1098, 1095, Schedule K-1"

# File stems under forms/. A template only loads if it is listed here.
forms = ["w2", "1099-int", "1099-nec", "1099-div", "1099-b", "1099-k", "1099-misc", "1098", "1095-a", "1095-b", "1095-c", "k1-1065", "k1-1120s"]

[codename]
# First codename segment for a document kind with no entry below.
default = "doc"

[codename.short]
"w2" = "w2"
"1099-int" = "1099int"
"1099-nec" = "1099nec"
"1099-div" = "1099div"
"1099-b" = "1099b"
"1099-k" = "1099k"
"1099-misc" = "1099misc"
"1098" = "1098"
"1095-a" = "1095a"
"1095-b" = "1095b"
"1095-c" = "1095c"
"k1-1065" = "k1"
"k1-1120s" = "k1"
"bank-statement" = "bank"
"closing-statement" = "closing"
"receipt" = "receipt"
"scan" = "scan"
