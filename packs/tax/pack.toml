# The US tax pack. Data, not code: see forms/*.toml for the template schema
# (documented in core/crates/inker-detect/src/template.rs).
name = "tax"
version = "0.1.0"
category = "Taxes"
description = "US federal tax forms: W-2, 1099 family, 1098, 1095, Schedule K-1, Form 1040, Form W-9"

# File stems under forms/. A template only loads if it is listed here.
forms = ["w2", "1099-int", "1099-nec", "1099-div", "1099-b", "1099-k", "1099-misc", "1099-misc-2026", "1098", "1095-a", "1095-b", "1095-c", "k1-1065", "k1-1120s", "1040", "w9"]

[codename]
# First codename segment for a document kind with no entry below.
default = "doc"

[codename.short]
# Must equal inker-core's kind_slug of the kind (tested): hyphens kept, a
# single letter glued to the number after it, so handles read
# 🐙/1099-int-2025, 🐙/k1-1065-2025, 🐙/bank-statement-2025.
"w2" = "w2"
"1099-int" = "1099-int"
"1099-nec" = "1099-nec"
"1099-div" = "1099-div"
"1099-b" = "1099-b"
"1099-k" = "1099-k"
"1099-misc" = "1099-misc"
"1098" = "1098"
"1095-a" = "1095-a"
"1095-b" = "1095-b"
"1095-c" = "1095-c"
"k1-1065" = "k1-1065"
"k1-1120s" = "k1-1120s"
"1040" = "1040"
"w9" = "w9"
"bank-statement" = "bank-statement"
"closing-statement" = "closing-statement"
"receipt" = "receipt"
"scan" = "scan"

[public]
# Agency contacts the IRS prints on its forms and in their instructions.
# Public lines, never anyone's personal details, so never inked. Phones are
# compared by their ten digits, emails ignoring case.
phones = [
  "1-800-829-1040",  # IRS, individuals
  "1-800-829-4933",  # IRS, businesses
  "1-800-829-3676",  # IRS, forms and publications
  "1-800-829-4059",  # IRS, TTY/TDD
  "1-800-908-4490",  # IRS, identity protection
  "1-877-777-4778",  # Taxpayer Advocate Service
  "1-800-366-4484",  # TIGTA
  "1-800-772-1213",  # Social Security Administration
  "1-877-438-4338",  # FTC, 877-IDTHEFT
  "1-800-318-2596",  # HealthCare.gov Marketplace call center
  "1-800-633-4227",  # 1-800-MEDICARE
]
emails = ["phishing@irs.gov", "spam@uce.gov"]
