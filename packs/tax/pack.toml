# The US tax pack. Data, not code: see forms/*.toml for the template schema
# (documented in core/crates/inker-detect/src/template.rs).
name = "tax"
version = "0.1.0"
description = "US federal tax forms: W-2, 1099 family, 1098, 1095, Schedule K-1"

# File stems under forms/. A template only loads if it is listed here.
forms = ["w2", "1099-int", "1099-nec", "1099-div", "1099-b", "1099-k", "1099-misc", "1099-misc-2026", "1098", "1095-a", "1095-b", "1095-c", "k1-1065", "k1-1120s"]

[codename]
# First codename segment for a document kind with no entry below.
default = "doc"

[codename.short]
# Must equal inker-core's kind_slug of the kind (tested): hyphens kept, a
# single letter glued to the number after it, so handles read
# 🐙/1099-int-2025, 🐙/k1-1065-2025, 🐙/bank-statement-2025.
"w2" = "w2"
"1099-int" = "1099-int"
"1099-nec" = "1099-nec"
"1099-div" = "1099-div"
"1099-b" = "1099-b"
"1099-k" = "1099-k"
"1099-misc" = "1099-misc"
"1098" = "1098"
"1095-a" = "1095-a"
"1095-b" = "1095-b"
"1095-c" = "1095-c"
"k1-1065" = "k1-1065"
"k1-1120s" = "k1-1120s"
"bank-statement" = "bank-statement"
"closing-statement" = "closing-statement"
"receipt" = "receipt"
"scan" = "scan"
