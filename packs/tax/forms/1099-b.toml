# Form 1099-B, Proceeds From Broker and Barter Exchange Transactions.
# Box labels follow the IRS wording. Schema: see w2.toml.
id = "1099-b"
display = "1099-B"
kind = "1099-b"
anchors = ['\b1099-B\b', 'Proceeds From Broker and Barter Exchange']
year = '(?s)1099-B.{0,80}?\b(20\d{2})\b'

[[fields]]
id = "payer_name"
label = '''PAYER['’]S name, street address(?:, city or town, state or province, country, ZIP or foreign postal code, and telephone (?:no\.?|number)|[^\n]*)'''
kind = "org"
treatment = "tokenize"
role = "payer"

[[fields]]
id = "payer_address"
label = '''PAYER['’]S name, street address(?:, city or town, state or province, country, ZIP or foreign postal code, and telephone (?:no\.?|number)|[^\n]*)'''
kind = "address"
treatment = "generalize"
role = "payer"
skip_lines = 1
lines = 2

[[fields]]
id = "payer_tin"
label = '''PAYER['’]S TIN'''
kind = "ein"
treatment = "tokenize"
role = "payer"

[[fields]]
id = "recipient_tin"
label = '''RECIPIENT['’]S TIN'''
kind = "ssn"
treatment = "tokenize"
role = "recipient"

[[fields]]
id = "recipient_name"
label = '''RECIPIENT['’]S name\b'''
kind = "person"
treatment = "tokenize"
role = "recipient"

[[fields]]
id = "recipient_street"
label = 'Street address \(including apt\. no\.\)'
kind = "address"
treatment = "tokenize"
role = "recipient"
value = "line"

[[fields]]
id = "recipient_city"
label = 'City or town, state or province(?:, country, and ZIP or foreign postal code|[^\n]*)'
kind = "address"
treatment = "generalize"
role = "recipient"
value = "line"

[[fields]]
id = "account"
label = 'Account number \(see instructions\)'
kind = "account"
treatment = "tokenize"
role = "recipient"

[[fields]]
id = "fatca"
label = 'FATCA filing requirement'
kind = "keep"
treatment = "keep"

[[fields]]
id = "cusip"
label = 'CUSIP number'
kind = "keep"
treatment = "keep"

[[fields]]
id = "1a"
label = '\b1a\s+Description of property(?:\s*\(Example:[^)]*\))?'
kind = "keep"
treatment = "keep"

[[fields]]
id = "1b"
label = '\b1b\s+Date acquired'
kind = "keep"
treatment = "keep"

[[fields]]
id = "1c"
label = '\b1c\s+Date sold or disposed'
kind = "keep"
treatment = "keep"

[[fields]]
id = "1d"
label = '\b1d\s+Proceeds'
