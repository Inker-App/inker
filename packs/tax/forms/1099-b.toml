label = '\b1e\s+Cost or other basis'
kind = "keep"
treatment = "keep"

[[fields]]
id = "1f"
label = '\b1f\s+Accrued market discount'
kind = "keep"
treatment = "keep"

[[fields]]
id = "1g"
label = '\b1g\s+Wash sale loss disallowed'
kind = "keep"
treatment = "keep"

[[fields]]
