# Form 1099-MISC, Miscellaneous Information, Rev. December 2026: the payer's
# and recipient's addresses split into boxes, 13a Cash tips, 13b TTOC,
# 14 Overtime compensation, 15 Nonqualified deferred compensation, 16-18
# state. Anchored on the revision date, so a 2026 form scores above the 2025
# template (one more anchor) and an older form never matches this one.
# Box labels follow the IRS wording. Schema: see w2.toml.
id = "1099-misc-2026"
display = "1099-MISC"
kind = "1099-misc"
anchors = ['\b1099-MISC\b', 'Miscellaneous Information', '\bRev\. (?:December 2026|12-2026)']
year = '(?s)1099-MISC.{0,80}?\b(20\d{2})\b'

[[fields]]
id = "payer_name"
label = '''PAYER['’]S name\b'''
kind = "org"
treatment = "tokenize"
role = "payer"

[[fields]]
id = "payer_street"
label = '''Street address Room or suite no\.?'''
kind = "address"
treatment = "tokenize"
role = "payer"
value = "line"

[[fields]]
id = "payer_city"
label = '''City or town Telephone number'''
kind = "address"
treatment = "tokenize"
role = "payer"
value = "line"

[[fields]]
id = "payer_tin"
label = '''PAYER['’]S TIN'''
kind = "ein"
treatment = "tokenize"
role = "payer"

[[fields]]
id = "recipient_tin"
label = '''RECIPIENT['’]S TIN'''
kind = "ssn"
treatment = "tokenize"
role = "recipient"

[[fields]]
id = "recipient_name"
label = '''RECIPIENT['’]S name\b'''
kind = "person"
treatment = "tokenize"
role = "recipient"

[[fields]]
id = "recipient_street"
label = '''Street address Apt\. no\.?'''
kind = "address"
treatment = "tokenize"
role = "recipient"
value = "line"

[[fields]]
id = "recipient_city"
label = '''\bCity or town\b'''
kind = "address"
treatment = "tokenize"
role = "recipient"
value = "line"

[[fields]]
id = "account"
label = '''Account number \(see instructions\)'''
kind = "account"
treatment = "tokenize"
role = "recipient"

[[fields]]
id = "fatca"
label = '''FATCA filing requirement'''
kind = "keep"
treatment = "keep"

[[fields]]
