# Form 1040, U.S. Individual Income Tax Return: pages 1 and 2 of the 2023
# revision. Lines 26 and 36 name tax years, and their patterns take any
# year, so the 2024 revision's wording matches too. Schema: see w2.toml.
#
# The identity, signature and preparer blocks are rows of column heads with
# the typed values on the row below, so most identifying fields read the cell
# under their label (value = "below"). Money lines keep the amount after the
# label on the same line.
#
# The first anchor is the title as printed on page 1 and in the page 2
# header ("Form 1040 (2023) Page 2"); "(Form 1040)" on a schedule and "Form
# 1040-SR" or "Form 1040-X" are not it.
id = "1040"
display = "1040"
kind = "1040"
anchors = ['(?:^|[^(\w])Form 1040(?:\s|$)', 'U\.S\. Individual Income Tax Return|\bPage 2\b']
year = '(?s)Form 1040.{0,120}?\b(20\d{2})\b'

# The tax year line: fixed wording around the dates of a fiscal year.
[[fields]]
id = "tax_year"
label = '''For the year Jan\. 1\s*[-–—]\s*Dec\. 31, 20\d{2}, or other tax year beginning'''
kind = "keep"
treatment = "keep"

[[fields]]
id = "mfs_name"
label = '''If you checked the MFS box, enter the name of your spouse\. If you checked the HOH or QSS box, enter the child['’]s name if the qualifying person is a child but not your dependent:?'''
kind = "person"
treatment = "tokenize"

[[fields]]
id = "name"
label = '''Your first name and middle initial'''
kind = "person"
treatment = "tokenize"
role = "taxpayer"
value = "below"

[[fields]]
id = "ssn"
label = '''Your social security number'''
kind = "ssn"
treatment = "tokenize"
role = "taxpayer"
value = "below"

[[fields]]
id = "spouse_name"
label = '''If joint return, spouse['’]s first name and middle initial'''
kind = "person"
treatment = "tokenize"
role = "spouse"
value = "below"

[[fields]]
id = "spouse_ssn"
label = '''Spouse['’]s social security number'''
kind = "ssn"
treatment = "tokenize"
role = "spouse"
value = "below"

[[fields]]
