# Schedule K-1 (Form 1065), Partner's Share of Income, Deductions, Credits, etc. The partnership is the payer, the partner the recipient.
# Box labels follow the IRS wording. Schema: see w2.toml.
id = "k1-1065"
display = "Schedule K-1 (Form 1065)"
kind = "k1-1065"
anchors = ['Schedule K-1', 'Form 1065\b', '''Partner['’]s Share of Income''']
year = '(?s)Schedule K-1.{0,80}?\b(20\d{2})\b'

[[fields]]
id = "A"
label = '''\bA\s+Partnership['’]s employer identification number'''
kind = "ein"
treatment = "tokenize"
role = "payer"

[[fields]]
id = "B_name"
