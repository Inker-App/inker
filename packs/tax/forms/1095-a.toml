# Form 1095-A, Health Insurance Marketplace Statement. Rows 16-20 are covered individuals.
# Box labels follow the IRS wording. Schema: see w2.toml.
id = "1095-a"
display = "1095-A"
kind = "1095-a"
anchors = ['\b1095-A\b', 'Health Insurance Marketplace Statement']
year = '(?s)1095-A.{0,80}?\b(20\d{2})\b'

[[fields]]
id = "1"
label = '\b1\s+Marketplace identifier'
kind = "keep"
treatment = "keep"

[[fields]]
id = "2"
label = '\b2\s+Marketplace-assigned policy number'
kind = "account"
treatment = "tokenize"
role = "recipient"

[[fields]]
id = "3"
label = '''\b3\s+Policy issuer['’]s name'''
kind = "org"
treatment = "tokenize"

[[fields]]
id = "4"
label = '''\b4\s+Recipient['’]s name'''
kind = "person"
treatment = "tokenize"
role = "recipient"

[[fields]]
id = "5"
label = '''\b5\s+Recipient['’]s SSN'''
kind = "ssn"
treatment = "tokenize"
role = "recipient"

[[fields]]
id = "6"
label = '''\b6\s+Recipient['’]s date of birth'''
kind = "dob"
treatment = "tokenize"
role = "recipient"
value = "date"

