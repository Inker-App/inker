# Form 1095-C, Employer-Provided Health Insurance Offer and Coverage. Rows 18-30 are covered individuals.
# Box labels follow the IRS wording. Schema: see w2.toml.
id = "1095-c"
display = "1095-C"
kind = "1095-c"
anchors = ['\b1095-C\b', 'Employer-Provided Health Insurance Offer and Coverage']
year = '(?s)1095-C.{0,80}?\b(20\d{2})\b'

[[fields]]
