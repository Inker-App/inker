# Schedule K-1 (Form 1120-S), Shareholder's Share of Income, Deductions, Credits, etc. The corporation is the payer, the shareholder the recipient.
# Box labels follow the IRS wording. Schema: see w2.toml.
id = "k1-1120s"
display = "Schedule K-1 (Form 1120-S)"
kind = "k1-1120s"
anchors = ['Schedule K-1', 'Form 1120-?S\b', '''Shareholder['’]s Share of Income''']
year = '(?s)Schedule K-1.{0,80}?\b(20\d{2})\b'

[[fields]]
id = "A"
label = '''\bA\s+Corporation['’]s employer identification number'''
kind = "ein"
treatment = "tokenize"
role = "payer"

[[fields]]
id = "B_name"
label = '''\bB\s+Corporation['’]s name, address, city, state, and ZIP code'''
kind = "org"
treatment = "tokenize"
role = "payer"

[[fields]]
id = "B_address"
label = '''\bB\s+Corporation['’]s name, address, city, state, and ZIP code'''
kind = "address"
treatment = "generalize"
role = "payer"
skip_lines = 1
lines = 2

[[fields]]
id = "C"
label = '\bC\s+IRS Cent(?:er|re) where corporation filed return'
kind = "keep"
treatment = "keep"

[[fields]]
id = "D"
label = '''\bD\s+Corporation['’]s total number of shares'''
kind = "keep"
treatment = "keep"

[[fields]]
id = "E"
label = '''\bE\s+Shareholder['’]s identifying number'''
kind = "ssn"
treatment = "tokenize"
role = "recipient"

