# Form 1099-DIV, Dividends and Distributions.
# Box labels follow the IRS wording. Schema: see w2.toml.
id = "1099-div"
display = "1099-DIV"
kind = "1099-div"
anchors = ['\b1099-DIV\b', 'Dividends and Distributions']
year = '(?s)1099-DIV.{0,80}?\b(20\d{2})\b'

[[fields]]
id = "payer_name"
label = '''PAYER['’]S name, street address(?:, city or town, state or province, country, ZIP or foreign postal code, and telephone (?:no\.?|number)|[^\n]*)'''
kind = "org"
treatment = "tokenize"
role = "payer"

[[fields]]
id = "payer_address"
label = '''PAYER['’]S name, street address(?:, city or town, state or province, country, ZIP or foreign postal code, and telephone (?:no\.?|number)|[^\n]*)'''
kind = "address"
treatment = "generalize"
role = "payer"
skip_lines = 1
lines = 2

[[fields]]
id = "payer_tin"
label = '''PAYER['’]S TIN'''
kind = "ein"
treatment = "tokenize"
role = "payer"

[[fields]]
id = "recipient_tin"
label = '''RECIPIENT['’]S TIN'''
kind = "ssn"
treatment = "tokenize"
role = "recipient"

[[fields]]
id = "recipient_name"
label = '''RECIPIENT['’]S name\b'''
kind = "person"
treatment = "tokenize"
role = "recipient"

[[fields]]
id = "recipient_street"
label = 'Street address \(including apt\. no\.\)'
kind = "address"
treatment = "tokenize"
role = "recipient"
value = "line"

[[fields]]
id = "recipient_city"
label = 'City or town, state or province(?:, country, and ZIP or foreign postal code|[^\n]*)'
kind = "address"
treatment = "generalize"
role = "recipient"
value = "line"

[[fields]]
id = "account"
label = 'Account number \(see instructions\)'
kind = "account"
treatment = "tokenize"
role = "recipient"

[[fields]]
id = "fatca"
label = 'FATCA filing requirement'
kind = "keep"
treatment = "keep"

[[fields]]
id = "1a"
label = '\b1a\s+Total ordinary dividends'
kind = "keep"
treatment = "keep"

[[fields]]
id = "1b"
label = '\b1b\s+Qualified dividends'
kind = "keep"
treatment = "keep"

[[fields]]
id = "2a"
label = '\b2a\s+Total capital gain distr\.?'
kind = "keep"
treatment = "keep"

[[fields]]
id = "2b"
label = '\b2b\s+Unrecap\. Sec\. 1250 gain'
kind = "keep"
treatment = "keep"

[[fields]]
id = "2c"
label = '\b2c\s+Section 1202 gain'
kind = "keep"
treatment = "keep"

[[fields]]
id = "2d"
label = '\b2d\s+Collectibles \(28%\) gain'
kind = "keep"
treatment = "keep"

[[fields]]
id = "2e"
label = '\b2e\s+Section 897 ordinary dividends'
kind = "keep"
treatment = "keep"

[[fields]]
id = "2f"
label = '\b2f\s+Section 897 capital gain'
kind = "keep"
treatment = "keep"

[[fields]]
id = "3"
label = '\b3\s+Nondividend distributions'
kind = "keep"
treatment = "keep"

[[fields]]
id = "4"
label = '\b4\s+Federal income tax withheld'
kind = "keep"
treatment = "keep"

[[fields]]
id = "5"
label = '\b5\s+Section 199A dividends'
kind = "keep"
treatment = "keep"

[[fields]]
id = "6"
label = '\b6\s+Investment expenses'
kind = "keep"
treatment = "keep"

[[fields]]
id = "7"
label = '\b7\s+Foreign tax paid'
kind = "keep"
treatment = "keep"

[[fields]]
id = "8"
label = '\b8\s+Foreign country or U\.S\. possession'
kind = "keep"
treatment = "keep"

[[fields]]
id = "9"
label = '\b9\s+Cash liquidation distributions'
kind = "keep"
treatment = "keep"

[[fields]]
id = "10"
label = '\b10\s+Noncash liquidation distributions'
kind = "keep"
treatment = "keep"

[[fields]]
id = "12"
label = '\b12\s+Exempt-interest dividends'
kind = "keep"
treatment = "keep"

[[fields]]
id = "13"
label = '\b13\s+Specified private activity bond interest dividends'
kind = "keep"
treatment = "keep"

[[fields]]
id = "16"
label = '\b16\s+State tax withheld'
kind = "keep"
treatment = "keep"

[[fields]]
id = "14"
label = '(?m)\b14\s+State\s*$'
kind = "keep"
treatment = "keep"

[[fields]]
id = "15"
label = '\b15\s+State identification no\.?'
kind = "state_id"
treatment = "tokenize"
role = "payer"
value = "account"
