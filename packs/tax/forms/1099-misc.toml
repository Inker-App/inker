# Form 1099-MISC, Miscellaneous Information, Rev. April 2025 (and earlier
# layouts): 13 FATCA filing requirement, 14 blank, 15 Nonqualified deferred
# compensation. Excess golden parachute payments moved to 1099-NEC box 3.
# The Rev. December 2026 layout is 1099-misc-2026.toml.
# Box labels follow the IRS wording. Schema: see w2.toml.
id = "1099-misc"
display = "1099-MISC"
kind = "1099-misc"
anchors = ['\b1099-MISC\b', 'Miscellaneous Information']
year = '(?s)1099-MISC.{0,80}?\b(20\d{2})\b'

[[fields]]
id = "payer_name"
label = '''PAYER['’]S name, street address(?:, city or town, state or province, country, ZIP or foreign postal code, and telephone (?:no\.?|number)|[^\n]*)'''
kind = "org"
treatment = "tokenize"
role = "payer"

[[fields]]
id = "payer_address"
label = '''PAYER['’]S name, street address(?:, city or town, state or province, country, ZIP or foreign postal code, and telephone (?:no\.?|number)|[^\n]*)'''
kind = "address"
treatment = "generalize"
role = "payer"
skip_lines = 1
lines = 2

[[fields]]
id = "payer_tin"
label = '''PAYER['’]S TIN'''
kind = "ein"
treatment = "tokenize"
role = "payer"

[[fields]]
id = "recipient_tin"
label = '''RECIPIENT['’]S TIN'''
kind = "ssn"
treatment = "tokenize"
role = "recipient"

[[fields]]
id = "recipient_name"
label = '''RECIPIENT['’]S name\b'''
kind = "person"
treatment = "tokenize"
role = "recipient"

[[fields]]
id = "recipient_street"
label = 'Street address \(including apt\. no\.\)'
kind = "address"
treatment = "tokenize"
role = "recipient"
value = "line"

[[fields]]
id = "recipient_city"
label = 'City or town, state or province(?:, country, and ZIP or foreign postal code|[^\n]*)'
kind = "address"
treatment = "generalize"
role = "recipient"
value = "line"

[[fields]]
id = "account"
label = 'Account number \(see instructions\)'
kind = "account"
treatment = "tokenize"
role = "recipient"

[[fields]]
id = "fatca"
label = '(?:\b13\s+)?FATCA filing requirement'
kind = "keep"
treatment = "keep"

[[fields]]
id = "1"
label = '\b1\s+Rents'
kind = "keep"
treatment = "keep"

[[fields]]
id = "2"
label = '\b2\s+Royalties'
kind = "keep"
treatment = "keep"

[[fields]]
id = "3"
label = '\b3\s+Other income'
kind = "keep"
treatment = "keep"

[[fields]]
id = "4"
label = '\b4\s+Federal income tax withheld'
kind = "keep"
treatment = "keep"

[[fields]]
id = "5"
label = '\b5\s+Fishing boat proceeds'
kind = "keep"
treatment = "keep"

[[fields]]
id = "6"
label = '\b6\s+Medical and health care payments'
kind = "keep"
treatment = "keep"

[[fields]]
id = "7"
label = '\b7\s+Payer made direct sales totaling \$5,000 or more(?: of consumer products to recipient for resale|[^\n]*)'
kind = "keep"
treatment = "keep"

[[fields]]
id = "8"
label = '\b8\s+Substitute payments in lieu of dividends or interest'
kind = "keep"
treatment = "keep"

[[fields]]
id = "9"
label = '\b9\s+Crop insurance proceeds'
kind = "keep"
treatment = "keep"

[[fields]]
id = "10"
label = '\b10\s+Gross proceeds paid to an attorney'
kind = "keep"
treatment = "keep"

[[fields]]
id = "11"
label = '\b11\s+Fish purchased for resale'
kind = "keep"
treatment = "keep"

[[fields]]
id = "12"
label = '\b12\s+Section 409A deferrals'
kind = "keep"
treatment = "keep"

[[fields]]
id = "15"
label = '\b15\s+Nonqualified deferred compensation'
kind = "keep"
treatment = "keep"

[[fields]]
id = "16"
label = '\b16\s+State tax withheld'
kind = "keep"
treatment = "keep"

[[fields]]
id = "18"
label = '\b18\s+State income'
kind = "keep"
treatment = "keep"

[[fields]]
id = "17"
label = '''\b17\s+State/Payer['’]s state no\.?'''
kind = "state_id"
treatment = "tokenize"
role = "payer"
value = "account"
